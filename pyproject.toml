[project]
name = "incident-council"
version = "0.1.0"
description = "Investigation d'incidents de production par agents specialistes independants + arbitre"
readme = "README.md"
# Bornee volontairement : le poste et le CI doivent tourner sur la MEME version.
# Sans borne haute, uv choisit la derniere disponible et on decouvre les ecarts
# au moment ou le benchmark coute de l'argent.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "typer>=0.15",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Phase 2 : premiers appels factures.
llm = ["anthropic>=0.121.0"]
# Phase 3 : orchestration.
graph = ["langgraph>=0.2"]
# Phase 4 : graphiques du rapport.
report = ["matplotlib>=3.9"]

[project.scripts]
council = "council.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["council"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# Les gabarits d'incidents sont en francais : caracteres ambigus attendus.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["council", "tests"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "matplotlib.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
